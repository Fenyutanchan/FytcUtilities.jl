name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        julia-version:
          - '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Julia environment
        uses: ./.github/actions/setup-julia-env
        with:
          julia-version: ${{ matrix.julia-version }}

      - name: Build package
        uses: julia-actions/julia-buildpkg@v1

      - name: Run tests
        uses: julia-actions/julia-runtest@v1
