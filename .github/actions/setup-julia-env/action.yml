name: Set up Julia environment
description: Set up Julia, cache artifacts, and add the required Julia registries.

inputs:
  julia-version:
    description: Julia version to set up
    required: false
    default: '1'

runs:
  using: composite
  steps:
    - name: Set up Julia
      uses: julia-actions/setup-julia@v2
      with:
        version: ${{ inputs.julia-version }}

    - name: Cache Julia artifacts
      uses: julia-actions/cache@v2

    - name: Add Julia registries
      shell: julia --color=yes {0}
      run: |
        using Pkg
        Pkg.Registry.add("General")
        Pkg.Registry.add(RegistrySpec(url = "https://github.com/Fenyutanchan/FytcJuliaRegistries"))
